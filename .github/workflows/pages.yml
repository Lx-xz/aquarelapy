name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      # O Pages precisa estar ligado a mao uma vez, em
      # Settings -> Pages -> Source: GitHub Actions.
      # O parametro `enablement: true` desta acao promete criar o site sozinho,
      # mas nao funciona: o GITHUB_TOKEN do workflow nao tem acesso a criacao
      # ("Resource not accessible by integration"), por mais que se conceda
      # `pages: write`. Nao adianta tentar de novo por aqui.
      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      # A página é estática e não depende de build: sobe a pasta como está.
      - name: Enviar a pasta do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
